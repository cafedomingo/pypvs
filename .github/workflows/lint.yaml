on:
  push:
    branches: [main]
  pull_request:
name: Lint Python

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[test]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
