[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypvs"
dynamic = ["version"]
authors = [
  { name="Aleksandar Mitev", email="amitev@sunstrongmanagement.com" }
]
description = "A Python package that exposes data and commands for a SunStrong Management PVS6 gateway."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp"
]

[project.optional-dependencies]
examples = ["zeroconf"]
test = ["pytest"]
lint = ["ruff==0.16.9", "mypy==2.3.1"]

[project.urls]
Homepage = "https://github.com/cafedomingo/pypvs"
Issues = "https://github.com/cafedomingo/pypvs/issues"
Upstream = "https://github.com/SunStrong-Management/pypvs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pypvs = ["py.typed"]

[tool.setuptools_scm]
# writes a file with __version__ so runtime can read it even from sdists
write_to = "src/pypvs/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/pypvs/_version.py"]

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "FURB",  # refurb
    "G",     # flake8-logging-format
    "I",     # isort
    "N",     # pep8-naming
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = ["N818"]  # PVSProbeFailed is public

[tool.ruff.lint.pep8-naming]
# public; the Home Assistant integration calls getVarserverVar
extend-ignore-names = [
    "getVarserver",
    "getVarserverVar",
    "getVarserverVars",
    "getVarserverVarsByName",
]

[tool.ruff.lint.mccabe]
max-complexity = 39  # carried over from .flake8

[tool.ruff.lint.isort]
known-first-party = ["pypvs"]

[tool.mypy]
python_version = "3.11"
files = ["src/pypvs"]
check_untyped_defs = true
warn_unused_ignores = true
